# =====================================================================
# Solid Mini Growth Engine — PRODUKSI
# Jalankan lewat skrip: ./infrastructure/scripts/smge.sh up
# (setara: docker compose --env-file .env.production -f docker-compose.prod.yml up -d --build)
#
# Hanya Nginx yang membuka port ke internet (80/443). PostgreSQL & Redis hanya di jaringan internal.
# =====================================================================

name: smge

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '5'

x-api-image: &api-image
  image: smge-api:${IMAGE_TAG:-latest}
  build:
    context: .
    dockerfile: infrastructure/docker/Dockerfile
    target: api

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]
    logging: *logging

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--requirepass', '${REDIS_PASSWORD}']
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]
    logging: *logging

  # Job sekali jalan: migrasi skema + seed (idempoten) sebelum API start
  migrate:
    <<: *api-image
    env_file: .env.production
    working_dir: /app/packages/database
    command:
      [
        'sh',
        '-c',
        './node_modules/.bin/prisma migrate deploy && ./node_modules/.bin/tsx prisma/seed.ts',
      ]
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  api:
    <<: *api-image
    restart: unless-stopped
    env_file: .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  worker:
    <<: *api-image
    restart: unless-stopped
    env_file: .env.production
    command: ['node', 'dist/worker.js']
    # worker tidak membuka port HTTP; health check image API tidak berlaku
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  dashboard:
    image: smge-dashboard:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: infrastructure/docker/Dockerfile
      target: dashboard
      args:
        API_INTERNAL_URL: http://api:4000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    networks: [internal]
    logging: *logging

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./infrastructure/nginx/templates:/etc/nginx/templates:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      api:
        condition: service_healthy
      dashboard:
        condition: service_healthy
    networks: [internal, edge]
    logging: *logging

  # Perpanjangan sertifikat Let's Encrypt (cek 2x sehari). Sertifikat awal: smge.sh init-ssl
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    entrypoint:
      [
        '/bin/sh',
        '-c',
        'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done',
      ]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks: [edge]
    logging: *logging

networks:
  # Tidak terhubung ke internet langsung; hanya antar-layanan
  internal:
  edge:

volumes:
  pgdata:
  redisdata:
  letsencrypt:
  certbot-www:
